    </div>
    <!-- Bleibt beim Neuzeichnen erhalten, damit die Musik weiterläuft -->
    <div id="music-dock" class="music-dock hidden">
      <div class="player-wrap">
        <div class="cover">🎵 Song ist verdeckt – nur du hörst ihn, die anderen raten</div>
        <div id="spotify-embed"></div>
      </div>
      <div class="controls">
        <button class="btn pink small" id="music-play">▶︎ Abspielen</button>
        <button class="btn small" id="music-pause">⏸ Pause</button>
        <button class="btn small" id="music-restart">⟲ Von vorn</button>
        <button class="btn small hidden" id="music-alt" title="Falls Spotify nichts abspielt">Spielt nicht? Vorschau nehmen</button>
        <span class="small muted" id="music-hint"></span>
      </div>
    </div>
    <div id="app"><div class="empty">Verbinde …</div></div>
